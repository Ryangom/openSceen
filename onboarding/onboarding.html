<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to ScreenClaw</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="container">
    <div class="icon-wrapper">
      <div class="icon">🎙️</div>
    </div>
    <h1>Welcome to ScreenClaw</h1>
    <p>
      To capture your voice alongside your screen recordings, we need microphone access. 
      This permission is only used when you explicitly start a recording.
    </p>
    <button id="btn-grant" class="btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
      </svg>
      <span>Allow Microphone Access</span>
    </button>
    <div id="error-msg" class="error-msg"></div>
  </div>
  <script src="onboarding.js"></script>
</body>
</html>
