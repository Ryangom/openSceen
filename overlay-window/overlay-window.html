<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScreenClaw Controller</title>
  <link rel="stylesheet" href="overlay-window.css">
</head>
<body>
  <div class="overlay-container" id="overlay-container">
    
    <!-- Webcam Preview Section -->
    <div class="webcam-section" id="webcam-section">
      <video id="webcam-preview" autoplay muted playsinline></video>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
      <!-- Drag Handle (just visual inside standalone window since window itself can be dragged by its top border, but nice for visual continuity) -->
      <div class="drag-handle" title="Drag Window">⋮⋮</div>
      
      <!-- Timer -->
      <div class="timer-display" id="timer-display">00:00</div>

      <!-- Button Actions -->
      <div class="action-buttons">
        <button id="btn-pause" title="Pause / Resume">
          <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-stop" title="Stop & Save">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
        <button id="btn-cancel" title="Cancel & Discard">
          <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </div>
    </div>

  </div>
  <script src="overlay-window.js"></script>
</body>
</html>
